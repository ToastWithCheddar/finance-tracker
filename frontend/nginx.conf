# frontend/nginx.conf — production SPA server (INFRA-DOCK-001)
#
# Used by frontend/Dockerfile `prod` target. The image is built from
# nginx:1.27-alpine; this file is copied to /etc/nginx/conf.d/default.conf.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------- Security headers ----------
    add_header X-Frame-Options           "DENY"                                always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    # TODO(INFRA-NGINX-002): tighten CSP. Plaid Link injects scripts from
    # cdn.plaid.com and creates iframes from production.plaid.com — any CSP
    # must allowlist those origins. Initial report-only policy below.
    # add_header Content-Security-Policy-Report-Only
    #     "default-src 'self'; script-src 'self' https://cdn.plaid.com; frame-src https://*.plaid.com; connect-src 'self' https://*.plaid.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; report-uri /csp-report"
    #     always;

    # ---------- Compression ----------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/ttf
        font/otf;

    # ---------- Static asset caching ----------
    # Vite emits hashed filenames in /assets/ — safe to cache forever.
    location ~* ^/assets/.*\.(?:js|mjs|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Other top-level static files: short cache
    location ~* \.(?:js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # index.html must never be cached — it is the bootstrap manifest.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    # Lightweight liveness probe used by docker compose healthcheck.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # SPA fallback — every unknown route serves index.html so React Router
    # can resolve client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reject hidden dotfiles (.git, .env, etc.).
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }
}
