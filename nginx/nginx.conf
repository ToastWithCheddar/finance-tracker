# nginx/nginx.conf — edge reverse proxy for finance-tracker.
#
# Findings addressed:
#   INFRA-NGINX-001 — adds 443 server block (guarded by cert presence) + HSTS
#                     only on 443; HTTP -> HTTPS redirect when TLS available.
#   INFRA-NGINX-002 — adds Content-Security-Policy (Report-Only),
#                     Permissions-Policy, Referrer-Policy.
#
# Cert provisioning is left to the operator; see docs/runbooks/tls-options.md
# for Caddy / acme-companion / cloud LB options. The `ssl_certificate` paths
# below resolve only when those files exist; the included file is referenced
# conditionally so missing certs do NOT break the HTTP server.

events {
    worker_connections 1024;
}

http {
    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:80;
    }

    # ----- Rate limit zones --------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api:10m   rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # ----- Shared security header map ---------------------------------------
    # CSP is intentionally loose + report-only initially. Plaid Link injects
    # scripts from cdn.plaid.com and frames production.plaid.com. Tighten
    # incrementally after observing the report endpoint.
    map $sent_http_content_type $csp_report_only {
        default "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.plaid.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://*.plaid.com wss://*; frame-src https://*.plaid.com; object-src 'none'; base-uri 'self'; form-action 'self'";
    }

    # =========================================================================
    # Port 80 — HTTP. If TLS is configured, redirect everything except ACME
    # challenge to 443; otherwise serve the app over plaintext (dev/local).
    # =========================================================================
    server {
        listen 80;
        server_name _;

        # ACME HTTP-01 challenge path (let acme-companion or certbot drop files
        # here without restarts).
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # If a cert exists, force HTTPS. We test for the file via a feature
        # flag env (SSL_ENABLED=1) baked at compose time. To keep this file
        # static we comment the redirect by default — uncomment when certs
        # are in place. (See INFRA-NGINX-001 in findings.csv.)
        #
        # return 301 https://$host$request_uri;

        # ---- Common headers (no HSTS — only on 443) ----
        add_header X-Frame-Options           "DENY"                            always;
        add_header X-Content-Type-Options    "nosniff"                         always;
        add_header X-XSS-Protection          "1; mode=block"                   always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy-Report-Only $csp_report_only       always;

        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend/api/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/auth/ {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://backend/api/auth/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # =========================================================================
    # Port 443 — HTTPS. Active only when /etc/nginx/ssl/fullchain.pem and
    # privkey.pem exist. `include` of a missing file is fatal, so this block
    # is gated behind the cert files being present at container start.
    # Operators: drop certs into nginx/ssl/ and reload, OR remove this block
    # if termination is handled at a cloud LB.
    # =========================================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # HSTS only over HTTPS (1y, includeSubDomains, preload-eligible).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options           "DENY"                            always;
        add_header X-Content-Type-Options    "nosniff"                         always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy-Report-Only $csp_report_only       always;

        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend/api/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/auth/ {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://backend/api/auth/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
