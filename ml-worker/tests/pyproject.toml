[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-worker-audit-tests"
version = "0.1.0"
description = "ml-worker test scaffolding."
requires-python = ">=3.11,<3.13"
dependencies = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "numpy==1.26.4",
    "sentence-transformers==2.7.0",
    "scikit-learn==1.5.2",
    "torch==2.2.2",
    "transformers==4.41.2",
    "huggingface-hub==0.23.5",
]

[tool.setuptools]
packages = ["helpers"]

[tool.pytest.ini_options]
testpaths = ["unit"]
asyncio_mode = "auto"
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
