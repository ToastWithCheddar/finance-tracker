# docker-compose.observability.yml — optional add-on stack
#
# Layer on top of docker-compose.prod.yml when log/metrics aggregation is
# desired. Brings up Prometheus, Grafana, Loki, Promtail, and an OTel
# collector. Configuration files live under ops/observability/.
#
# Bring up:
#   docker compose \
#     -f docker-compose.prod.yml \
#     -f docker-compose.observability.yml \
#     up -d
#
# Findings addressed: INFRA-OBS-001 (log aggregation), INFRA-OBS-002 (metrics).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  prometheus:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    volumes:
      - ./ops/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.path=/prometheus
    expose:
      - "9090"
    mem_limit: 512m
    cpus: 0.5
    logging: *default-logging
    networks: [observability]

  grafana:
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./ops/observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3030:3000"
    mem_limit: 512m
    cpus: 0.5
    logging: *default-logging
    networks: [observability]

  loki:
    image: grafana/loki:2.9.0
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    expose:
      - "3100"
    mem_limit: 512m
    cpus: 0.5
    logging: *default-logging
    networks: [observability]

  promtail:
    image: grafana/promtail:2.9.0
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./ops/observability/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 256m
    cpus: 0.25
    logging: *default-logging
    networks: [observability]
    depends_on: [loki]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.97.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/collector-config.yaml"]
    volumes:
      - ./ops/observability/otel/collector-config.yaml:/etc/otelcol/collector-config.yaml:ro
    expose:
      - "4317"   # OTLP gRPC
      - "4318"   # OTLP HTTP
    mem_limit: 512m
    cpus: 0.5
    logging: *default-logging
    networks: [observability]

volumes:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  observability:
    driver: bridge
