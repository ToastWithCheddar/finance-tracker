# OpenTelemetry Collector configuration for finance-tracker.
# Receives OTLP/gRPC from backend + ml-worker and fans out to:
#   - Prometheus (metrics) on :8889
#   - logging (debug) — stdout for local development
# Tempo (traces) wiring is left commented; see Wave 6 infra work.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512
  memory_limiter:
    check_interval: 2s
    limit_percentage: 80
    spike_limit_percentage: 25

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: finance_tracker
    send_timestamps: true
  logging:
    loglevel: debug
  # tempo:                # Future work — Wave 6 infra wiring.
  #   endpoint: tempo:4317
  #   tls:
  #     insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus, logging]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [logging]
      # exporters: [logging, tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [logging]
